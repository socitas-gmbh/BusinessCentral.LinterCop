name: CICD
on:
  push:
    branches:
      - master
      - prerelease
  pull_request:
  workflow_dispatch: null

permissions:
  contents: write
  packages: write

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: resolve-version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $latest = gh release list --repo ${{ github.repository }} --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName'
          if ([string]::IsNullOrWhiteSpace($latest)) {
            $next = '0.41.1'
          }
          else {
            $current = [version]$latest.TrimStart('v')
            $next = "$($current.Major).$($current.Minor).$($current.Build + 1)"
          }
          Write-Host "Next release version: $next"
          echo "version=$next" >> $env:GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        uses: release-drafter/release-drafter@v6
        if: github.event_name != 'pull_request'
        with:
          version: ${{ steps.resolve-version.outputs.version }}
          prerelease: ${{ github.ref != 'refs/heads/master' }}
          commitish: ${{ github.ref }}
          disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get AL Language versions from Marketplace
        id: marketplace
        uses: ./.github/actions/marketplace

      - name: Populate matrix for build job strategy
        id: setup-build-matrix
        uses: ./.github/actions/build-matrix
        with:
          sources: ${{ steps.marketplace.outputs.sources }}
          al-version-latest: ${{ steps.marketplace.outputs.al-version-latest }}
          al-version-prerelease: ${{ steps.marketplace.outputs.al-version-prerelease }}

    outputs:
      github-event-name: ${{ github.event_name }}
      release-tag-name: ${{ steps.create-release.outputs.tag_name }}
      release-upload-url: ${{ steps.create-release.outputs.upload_url }}
      matrix: ${{ steps.setup-build-matrix.outputs.matrix }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Build artifact
        id: dotnet-build
        uses: ./.github/actions/dotnet-build
        with:
          asset-version-number: ${{ needs.setup.outputs.release-tag-name }}
          asset-name: ${{ matrix.assetname }}
          asset-publish: ${{ needs.setup.outputs.github-event-name != 'pull_request' }}
          al-version-number: ${{ matrix.version }}
          al-asset-uri: ${{ matrix.assetUri }}
          al-asset-type: ${{ matrix.assetType }}
          al-latest: ${{ matrix.latest }}
          al-prerelease: ${{ matrix.prerelease }}

  publish:
    name: Publish
    runs-on: windows-latest
    needs:
      - setup
      - build
    if: ${{ !cancelled() && needs.setup.result == 'success' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        id: download-artifacts
        uses: ./.github/actions/download-artifacts
        with:
          path: ${{ github.workspace }}\BuildArtifacts

      - name: Publish Assets
        id: upload-release-assets
        shell: pwsh
        env:
          ARTIFACTS_PATH: ${{ github.workspace }}\BuildArtifacts
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_UPLOAD_URL: ${{ needs.setup.outputs.release-upload-url }}
        run: |
          # The upload-url contains "{?name,label}" at the end, which needs to be removed
          $upload_url = $env:RELEASE_UPLOAD_URL -replace '{\?name,label}', ''
          Write-Host "upload-url: $($upload_url)" 

          # Find all the .dll files in the directory
          $artifacts = Get-ChildItem -Path $env:ARTIFACTS_PATH -Depth 0 -Filter *.dll

          # Loop through each artifact and upload it using curl (which handles multipart form data)
          $artifacts | ForEach-Object {
              $asset_name = $_.Name
              $asset_path = $_.FullName

              Write-Host "Uploading $asset_name..."
              curl -L `
                -X POST `
                -H "Accept: application/vnd.github+json" `
                -H "Authorization: token $env:GITHUB_TOKEN" `
                -H "X-GitHub-Api-Version: 2022-11-28" `
                -H "Content-Type: application/octet-stream" `
                "$($upload_url)?name=$($asset_name)" `
                --data-binary `@"$asset_path"
          }

      - name: Publish NuGet package
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          ARTIFACTS_PATH: ${{ github.workspace }}\BuildArtifacts
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_NAME: ${{ needs.setup.outputs.release-tag-name }}
        run: |
          $version = $env:RELEASE_TAG_NAME.TrimStart('v')
          $dll = Join-Path $env:ARTIFACTS_PATH 'BusinessCentral.LinterCop.dll'
          if (!(Test-Path $dll)) { throw "BusinessCentral.LinterCop.dll (latest AL Language) was not built" }

          $packageDir = Join-Path $env:RUNNER_TEMP 'nuget'
          New-Item -Path $packageDir -ItemType Directory -Force | Out-Null
          Copy-Item $dll $packageDir
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2013/05/nuspec.xsd">
            <metadata>
              <id>BusinessCentral.LinterCop</id>
              <version>$version</version>
              <authors>StefanMaron</authors>
              <license type="expression">MIT</license>
              <projectUrl>https://github.com/${{ github.repository }}</projectUrl>
              <repository type="git" url="https://github.com/${{ github.repository }}" />
              <description>Community driven code linter for AL (MS Dynamics 365 Business Central).</description>
              <tags>businesscentral al linter analyzer</tags>
            </metadata>
            <files>
              <file src="BusinessCentral.LinterCop.dll" target="" />
            </files>
          </package>
          "@ | Set-Content (Join-Path $packageDir 'BusinessCentral.LinterCop.nuspec')

          nuget pack (Join-Path $packageDir 'BusinessCentral.LinterCop.nuspec') -OutputDirectory $packageDir -NoDefaultExcludes
          dotnet nuget push (Join-Path $packageDir "BusinessCentral.LinterCop.$version.nupkg") `
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --api-key $env:GITHUB_TOKEN `
            --skip-duplicate

      - name: Publish release
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_NAME: ${{ needs.setup.outputs.release-tag-name }}
        run: gh release edit $env:RELEASE_TAG_NAME --repo ${{ github.repository }} --draft=false --latest
